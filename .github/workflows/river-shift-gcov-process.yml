name: RiverShift NISAR GCOV processing

run-name: RiverShift ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Owner-scoped RiverShift job UUID
        required: true
        type: string
      aoi_wkt:
        description: User-selected WGS84 AOI polygon
        required: true
        type: string
      start_date:
        description: First allowed acquisition date (YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: Last allowed acquisition date (YYYY-MM-DD)
        required: true
        type: string
      event_date:
        description: User-supplied event date; independently unverified
        required: true
        type: string
      maturity:
        description: One NISAR collection maturity; never mix BETA and PROVISIONAL
        required: true
        type: choice
        options: [PROVISIONAL, BETA]
      main_band_polarization:
        description: Exact main-band polarization filter used during catalogue discovery
        required: false
        type: string
      flight_direction:
        description: Exact orbit-direction filter used during catalogue discovery
        required: false
        type: string
      frame_coverage:
        description: NISAR filename frame-coverage filter used during catalogue discovery
        required: true
        type: choice
        options: [ALL, FULL, PARTIAL]
      frequency:
        description: Requested NISAR frequency
        required: true
        type: choice
        options: [frequencyA, frequencyB]
      covariance_term:
        description: Requested real-valued diagonal GCOV term
        required: true
        type: choice
        options: [HHHH, HVHV, VVVV, VHVH, RHRH, RVRV]
      threshold_method:
        description: Common water threshold
        required: true
        type: choice
        options: [otsu, manual]
      threshold_db:
        description: Manual dB threshold; blank for Otsu
        required: false
        type: string
      granule_names_json:
        description: Exact granule names from the accepted CMR manifest
        required: true
        type: string
      request_fingerprint:
        description: Immutable API-generated request fingerprint
        required: true
        type: string
      callback_url:
        description: Public HTTPS base URL of the Dynamic API
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: river-shift-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RIVERSHIFT_JOB_ID: ${{ inputs.job_id }}
      RIVERSHIFT_AOI_WKT: ${{ inputs.aoi_wkt }}
      RIVERSHIFT_START_DATE: ${{ inputs.start_date }}
      RIVERSHIFT_END_DATE: ${{ inputs.end_date }}
      RIVERSHIFT_EVENT_DATE: ${{ inputs.event_date }}
      RIVERSHIFT_MATURITY: ${{ inputs.maturity }}
      RIVERSHIFT_MAIN_BAND_POLARIZATION: ${{ inputs.main_band_polarization }}
      RIVERSHIFT_FLIGHT_DIRECTION: ${{ inputs.flight_direction }}
      RIVERSHIFT_FRAME_COVERAGE: ${{ inputs.frame_coverage }}
      RIVERSHIFT_FREQUENCY: ${{ inputs.frequency }}
      RIVERSHIFT_COVARIANCE_TERM: ${{ inputs.covariance_term }}
      RIVERSHIFT_THRESHOLD_METHOD: ${{ inputs.threshold_method }}
      RIVERSHIFT_THRESHOLD_DB: ${{ inputs.threshold_db }}
      RIVERSHIFT_GRANULE_NAMES_JSON: ${{ inputs.granule_names_json }}
      RIVERSHIFT_REQUEST_FINGERPRINT: ${{ inputs.request_fingerprint }}
      RIVERSHIFT_CALLBACK_URL: ${{ inputs.callback_url }}
      RIVERSHIFT_CALLBACK_SECRET: ${{ secrets.RIVERSHIFT_CALLBACK_SECRET }}
      PYTHONUNBUFFERED: "1"
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}

    steps:
      - name: Check out backend worker source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log non-secret RiverShift dispatch context
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::RiverShift request context (sensitive values omitted)"
          printf 'job_id=%s\n' "$RIVERSHIFT_JOB_ID"
          printf 'date_window=%s..%s\n' "$RIVERSHIFT_START_DATE" "$RIVERSHIFT_END_DATE"
          printf 'event_date=%s\n' "$RIVERSHIFT_EVENT_DATE"
          printf 'maturity=%s frequency=%s covariance_term=%s\n' "$RIVERSHIFT_MATURITY" "$RIVERSHIFT_FREQUENCY" "$RIVERSHIFT_COVARIANCE_TERM"
          printf 'frame_coverage=%s flight_direction=%s main_band_polarization=%s\n' "$RIVERSHIFT_FRAME_COVERAGE" "${RIVERSHIFT_FLIGHT_DIRECTION:-not_set}" "${RIVERSHIFT_MAIN_BAND_POLARIZATION:-not_set}"
          python - <<'PY'
          import json
          import os
          raw = os.environ.get("RIVERSHIFT_GRANULE_NAMES_JSON", "")
          try:
              names = json.loads(raw)
              count = len(names) if isinstance(names, list) else "invalid"
          except json.JSONDecodeError:
              count = "invalid"
          print(f"accepted_granule_count={count}")
          for key in (
              "EARTHDATA_TOKEN", "EARTHDATA_USERNAME", "EARTHDATA_PASSWORD",
              "GOOGLE_DRIVE_OAUTH_CLIENT_JSON", "GOOGLE_DRIVE_REFRESH_TOKEN",
              "GOOGLE_DRIVE_PARENT_FOLDER_ID",
              "RIVERSHIFT_CALLBACK_SECRET",
          ):
              print(f"{key}_present={'yes' if os.environ.get(key, '').strip() else 'no'}")
          PY
          echo "::endgroup::"

      - name: Install GDAL and geospatial dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/river_shift/environment.yml
          cache-environment: true
          generate-run-shell: true

      - name: Verify runtime
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          echo "::group::RiverShift runtime verification"
          echo "RIVERSHIFT_RUNTIME_STAGE=python START"
          python --version
          echo "RIVERSHIFT_RUNTIME_STAGE=gdal START"
          gdalinfo --version
          echo "RIVERSHIFT_RUNTIME_STAGE=python-geospatial-imports START"
          python -c "import rasterio, shapely, pyproj, scipy; print('RIVERSHIFT_GEOSPATIAL_RUNTIME=PASS')"
          echo "RIVERSHIFT_RUNTIME_STAGE=all PASS"
          echo "::endgroup::"

      - name: Discover, download, process, retain private results and report callbacks
        shell: micromamba-shell {0}
        run: python -u tools/river_shift/process_gcov_job.py
