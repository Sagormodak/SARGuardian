# Generated by scripts/centralize_workflows.py; scientific source SHAs are unchanged.
name: Frontend build, lint and tests
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Frontend
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: dd64b7adc90594f1d7f316b352e39fbac2013cb6
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: Frontend/package-lock.json
    - name: Install locked dependencies
      run: npm ci
    - name: Type-check and build
      run: npm run build
    - name: Lint
      run: npm run lint
    - name: Unit tests
      run: npm test
