# Generated by scripts/centralize_workflows.py; scientific source SHAs are unchanged.
name: Scientific engine regression tests
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  science-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out scientific engine
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: 9fcb543ef28a7f6fe70a379aed9cfe3e43e277ec
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install pinned dependencies
      run: python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r requirements.txt
    - name: Run complete scientific regression suite
      run: python -m pytest tests/ -q
