name: Know Place AOI analysis — polygon/date-range

on:
  workflow_dispatch:
    inputs:
      backend_science_ref:
        description: "Immutable 40-character commit SHA containing the backend science code to execute"
        required: true
        default: "526090db8ae2efb7b800129a9d4d9b7eba87efbf"
        type: string
      aoi_wkt:
        description: "Measurement polygon: closed WGS84 POLYGON WKT (longitude latitude; one exterior ring)"
        required: true
        type: string
      scope_aoi_wkt:
        description: "Optional outer AOI boundary WKT; measurement and reference polygons must lie strictly inside it"
        required: false
        default: ""
        type: string
      start_date:
        description: "Inclusive UTC start date, YYYY-MM-DD"
        required: true
        type: string
      end_date:
        description: "Inclusive UTC end date, YYYY-MM-DD"
        required: true
        type: string
      hazard_mode:
        description: "Event class for validation metadata; this does not auto-classify an event"
        required: true
        type: choice
        options:
          - landslide
          - glacier_collapse
          - ice_rock_avalanche
          - mixed
        default: mixed
      analysis_mode:
        description: "Exploratory measurement or retrospective validation; operational monitoring remains blocked until independent DEM-backed validation"
        required: true
        type: choice
        options:
          - exploratory
          - retrospective_validation
        default: exploratory
      geometry_height_m:
        description: "Optional constant ellipsoidal height in metres for an explicit sensitivity run; blank uses geometry-axis median approximation, not a DEM"
        required: false
        default: ""
        type: string
      coherence_neighbours:
        description: "Minimum valid neighbours in the local coherence window; retain setting for sensitivity analysis"
        required: true
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "15"
          - "20"
          - "25"
        default: "1"
      polarization:
        description: "NISAR frequency-A polarization"
        required: true
        type: choice
        options:
          - HH
          - HV
          - VV
          - VH
        default: HH
      track:
        description: "Optional three-digit track (use ANY to retain separate orbit chains)"
        required: true
        type: string
        default: ANY
      direction:
        description: "Optional flight direction"
        required: true
        type: choice
        options:
          - ANY
          - A
          - D
        default: ANY
      allowed_release_ids:
        description: "Optional comma-separated exact release IDs (e.g. P05023). Blank keeps all; ambiguous variants fail safe rather than auto-substitute."
        required: false
        default: ""
        type: string
      reference_wkt:
        description: "Optional independent reference/background polygon WKT; blank uses local-context correction"
        required: false
        type: string
      candidate_context_json:
        description: "Optional provenance JSON for a GOFF candidate imported from Find Displacements; metadata only"
        required: false
        default: ""
        type: string
      consent_marker:
        description: "Required: enter exactly [run-know-place] when execute_downloads is true"
        required: false
        default: ""
        type: string
      execute_downloads:
        description: "Download selected raw GOFF products, compute measurements, GeoTIFFs and dashboard, and upload a derived result bundle to Drive"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      backend_science_ref:
        description: "Immutable backend science source commit SHA"
        required: true
        type: string
      aoi_wkt:
        required: true
        type: string
      scope_aoi_wkt:
        description: "Optional outer AOI boundary WKT; not used as the measurement polygon"
        required: false
        default: ""
        type: string
      start_date:
        required: true
        type: string
      end_date:
        required: true
        type: string
      hazard_mode:
        required: false
        default: mixed
        type: string
      analysis_mode:
        required: false
        default: exploratory
        type: string
      geometry_height_m:
        required: false
        default: ""
        type: string
      coherence_neighbours:
        required: false
        default: "1"
        type: string
      polarization:
        required: false
        default: HH
        type: string
      track:
        required: false
        default: ANY
        type: string
      direction:
        required: false
        default: ANY
        type: string
      allowed_release_ids:
        description: "Optional comma-separated exact release IDs (e.g. P05023). Blank keeps all; ambiguous variants fail safe rather than auto-substitute."
        required: false
        default: ""
        type: string
      reference_wkt:
        required: false
        default: ""
        type: string
      candidate_context_json:
        description: "Optional metadata-only provenance for an imported GOFF candidate"
        required: false
        default: ""
        type: string
      consent_marker:
        required: false
        default: ""
        type: string
      execute_downloads:
        required: false
        default: false
        type: boolean
    secrets:
      EARTHDATA_TOKEN:
        required: false
      EARTHDATA_USERNAME:
        required: false
      EARTHDATA_PASSWORD:
        required: false
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      GOOGLE_DRIVE_PARENT_FOLDER_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: know-place-aoi-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze-aoi:
    name: Validate AOI and build reproducible GOFF measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
      OUTPUT_ROOT: know-place-aoi-output
      BACKEND_SCIENCE_REF: ${{ inputs.backend_science_ref }}

    steps:
      - name: Checkout the backend science repository at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: moshiour0/SARGuardian-backend
          ref: ${{ inputs.backend_science_ref }}

      - name: Verify backend source identity and immutable pin
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BACKEND_SCIENCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR=BACKEND_SCIENCE_REF_MUST_BE_IMMUTABLE_40_CHAR_SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$BACKEND_SCIENCE_REF" ]]; then
            echo "ERROR=BACKEND_SCIENCE_CHECKOUT_SHA_MISMATCH expected=$BACKEND_SCIENCE_REF actual=$actual"
            exit 1
          fi
          echo "BACKEND_SCIENCE_REPOSITORY=moshiour0/SARGuardian-backend"
          echo "BACKEND_SCIENCE_COMMIT=$actual"
          printf '%s\n' "$actual" > backend-science-source.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install versioned Know Place runtime
        run: python -m pip install --disable-pip-version-check -r tools/know_place/requirements.txt

      - name: Write normalized request input without shell interpolation
        shell: bash
        env:
          AOI_WKT: ${{ inputs.aoi_wkt }}
          SCOPE_AOI_WKT: ${{ inputs.scope_aoi_wkt }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          HAZARD_MODE: ${{ inputs.hazard_mode }}
          ANALYSIS_MODE: ${{ inputs.analysis_mode }}
          GEOMETRY_HEIGHT_M: ${{ inputs.geometry_height_m }}
          COHERENCE_NEIGHBOURS: ${{ inputs.coherence_neighbours }}
          POLARIZATION: ${{ inputs.polarization }}
          TRACK: ${{ inputs.track }}
          DIRECTION: ${{ inputs.direction }}
          ALLOWED_RELEASE_IDS: ${{ inputs.allowed_release_ids }}
          REFERENCE_WKT: ${{ inputs.reference_wkt }}
          CANDIDATE_CONTEXT_JSON: ${{ inputs.candidate_context_json }}
          CONSENT_MARKER: ${{ inputs.consent_marker || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selection = {
              "allowed_maturities": ["PROVISIONAL"],
              "preferred_granules": [],
              "allowed_release_ids": [item.strip().upper() for item in os.environ.get("ALLOWED_RELEASE_IDS", "").split(",") if item.strip()],
          }
          if os.environ["TRACK"].strip().upper() != "ANY":
              selection["track"] = os.environ["TRACK"].strip()
          if os.environ["DIRECTION"].strip().upper() != "ANY":
              selection["direction"] = os.environ["DIRECTION"].strip().upper()

          request = {
              "schema_version": "know-place-aoi-request/1.0",
              "aoi": {
                  "type": "Polygon",
                  "crs": "EPSG:4326",
                  "role": "measurement",
                  "wkt": os.environ["AOI_WKT"].strip(),
              },
              "date_range": {
                  "start": os.environ["START_DATE"].strip(),
                  "end": os.environ["END_DATE"].strip(),
                  "inclusive": True,
              },
              "hazard_mode": os.environ["HAZARD_MODE"].strip(),
              "analysis_mode": os.environ["ANALYSIS_MODE"].strip(),
              "source_adapters": ["NISAR_GOFF"],
              "polarization": os.environ["POLARIZATION"].strip(),
              "product_selection": selection,
              "quality_policy": {
                  "minimum_snr": 5.0,
                  "maximum_horizontal_magnitude_m": 10.0,
                  "magnitude_policy": "flag_above_threshold_keep",
              },
              "coherence_policy": {
                  "window_size": 5,
                  "minimum_valid_neighbours": int(os.environ["COHERENCE_NEIGHBOURS"]),
              },
          }
          scope_aoi = os.environ.get("SCOPE_AOI_WKT", "").strip()
          if scope_aoi:
              request["scope_aoi"] = {
                  "type": "Polygon",
                  "crs": "EPSG:4326",
                  "role": "outer_selection_boundary",
                  "wkt": scope_aoi,
              }
          raw_candidate_context = os.environ.get("CANDIDATE_CONTEXT_JSON", "").strip()
          if raw_candidate_context:
              candidate_context = json.loads(raw_candidate_context)
              if not isinstance(candidate_context, dict):
                  raise SystemExit("CANDIDATE_CONTEXT_JSON_MUST_BE_OBJECT")
              request["candidate_context"] = candidate_context
          raw_height = os.environ.get("GEOMETRY_HEIGHT_M", "").strip()
          if raw_height:
              try:
                  request["geometry_policy"] = {"constant_hae_m": float(raw_height)}
              except ValueError as exc:
                  raise SystemExit("ERROR=GEOMETRY_HEIGHT_MUST_BE_NUMERIC") from exc
          else:
              request["geometry_policy"] = {}
          reference = os.environ.get("REFERENCE_WKT", "").strip()
          if reference:
              request["reference"] = {
                  "policy": "external_reference_polygon_component_median",
                  "polygon_wkt": reference,
                  "fallback_buffer_m": 2000.0,
              }
          Path("know-place-request.json").write_text(
              json.dumps(request, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print("REQUEST_JSON_WRITTEN=know-place-request.json")
          PY

      - name: Preflight all required credentials before any raw source download
        if: ${{ inputs.execute_downloads }}
        shell: bash
        env:
          CONSENT_MARKER: ${{ inputs.consent_marker || '' }}
        run: |
          set -euo pipefail
          if [[ "$CONSENT_MARKER" != "[run-know-place]" ]]; then
            echo "ERROR=EXPLICIT_RAW_DOWNLOAD_CONSENT_MARKER_REQUIRED"
            exit 1
          fi
          if [[ -z "$EARTHDATA_TOKEN" && ( -z "$EARTHDATA_USERNAME" || -z "$EARTHDATA_PASSWORD" ) ]]; then
            echo "ERROR=EARTHDATA_CREDENTIALS_REQUIRED_BEFORE_DOWNLOAD"
            exit 1
          fi
          if [[ -z "$GOOGLE_DRIVE_OAUTH_CLIENT_JSON" || -z "$GOOGLE_DRIVE_REFRESH_TOKEN" || -z "$GOOGLE_DRIVE_PARENT_FOLDER_ID" ]]; then
            echo "ERROR=DRIVE_SECRETS_REQUIRED_BEFORE_DOWNLOAD"
            exit 1
          fi
          echo "EARTHDATA_CREDENTIAL_PREFLIGHT=PASS"
          echo "DRIVE_CREDENTIAL_PREFLIGHT=PASS"
          echo "DOWNLOAD_OPT_IN=PASS"

      - name: Catalog-only dry run (no product downloads)
        if: ${{ !inputs.execute_downloads }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.know_place.aoi_runner \
            --request know-place-request.json \
            --out "$OUTPUT_ROOT" \
            --dry-run

      - name: Download exact selected GOFF granules and compute measurements
        if: ${{ inputs.execute_downloads }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.know_place.aoi_runner \
            --request know-place-request.json \
            --out "$OUTPUT_ROOT" \
            --cache-dir "$RUNNER_TEMP/know-place-source-cache" \
            --ephemeral-source-cache

      - name: Upload and byte-verify the derived result bundle in central Drive
        if: ${{ inputs.execute_downloads && success() }}
        shell: bash
        env:
          BUNDLE_FOLDER_NAME: know-place-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python -m tools.know_place.upload_bundle_to_drive \
            --run-root "$OUTPUT_ROOT" \
            --folder-name "$BUNDLE_FOLDER_NAME"

      - name: Emit scientific claim/status summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Know Place AOI analysis"
            echo
            echo "- Caller workflow repository/ref: $GITHUB_REPOSITORY@$GITHUB_REF_NAME"
            echo "- Caller workflow commit: $GITHUB_SHA"
            echo "- Backend science repository: moshiour0/SARGuardian-backend"
            echo "- Backend science commit: $BACKEND_SCIENCE_REF"
            echo "- AOI input: know-place-request.json"
            if [[ "${{ inputs.execute_downloads }}" == "true" ]]; then
              echo "- Source downloads: opted in; exact product hashes and receipts are recorded per run"
            else
              echo "- Source downloads: not run (catalog/series-plan only)"
            fi
            echo "- Result artifact: $OUTPUT_ROOT/"
            echo "- A successful measurement run is not a validated hazard alarm."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -d "$OUTPUT_ROOT" ]]; then
            find "$OUTPUT_ROOT" -maxdepth 3 -type f | sort | sed 's#^#- #g' >> "$GITHUB_STEP_SUMMARY"
            python - "$OUTPUT_ROOT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          output_root, summary_path = Path(sys.argv[1]), Path(sys.argv[2])
          lines = []
          for failure_path in sorted(output_root.glob("*/failure.json")):
              try:
                  failure = json.loads(failure_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              detail = failure.get("failure", {}) if isinstance(failure, dict) else {}
              code = str(detail.get("code", "ANALYSIS_FAILED"))
              safe_message = str(detail.get("safe_message", "No safe failure detail was recorded."))
              lines.extend(["", "### Failure diagnostics", f"- Code: `{code}`", f"- Detail: {safe_message}"])
              if code == "AMBIGUOUS_PRODUCT_RELEASE_VARIANTS":
                  diagnostics = detail.get("selection_diagnostics", {})
                  releases = diagnostics.get("candidate_release_ids", [])
                  lines.extend([
                      "- Action: select the intended exact release ID in the UI and rerun catalog-only dry run.",
                      "- No raw GOFF product was downloaded because series planning stopped before acquisition.",
                      "- Candidate release IDs: " + (", ".join(map(str, releases)) if releases else "not resolved"),
                  ])
                  for pair in diagnostics.get("ambiguous_pairs", [])[:10]:
                      lines.append(
                          "- Ambiguous pair: "
                          + str(pair.get("pair", "unknown"))
                          + " | candidates: "
                          + ", ".join(map(str, pair.get("candidate_release_ids", [])))
                      )
                      for granule in pair.get("candidate_granules", [])[:4]:
                          lines.append("  - " + str(granule))
              elif detail.get("required_user_action"):
                  lines.append("- Action: " + str(detail["required_user_action"]))
          if lines:
              with summary_path.open("a", encoding="utf-8") as stream:
                  stream.write("\\n".join(lines) + "\\n")
          PY
          fi

      - name: Preserve report, dashboard, maps and Drive receipt as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: know-place-aoi-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend-science-source.txt
            know-place-request.json
            know-place-aoi-output/**
          if-no-files-found: warn
          retention-days: 30
