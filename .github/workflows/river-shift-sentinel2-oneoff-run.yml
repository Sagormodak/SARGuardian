name: RiverShift one-off retained-run Sentinel-2 replay

on:
  push:
    branches:
      - run/rivershift-sentinel2-replay-once-20261104

permissions:
  actions: read
  contents: read

concurrency:
  group: river-shift-sentinel2-oneoff-41642281327-2026-07-12
  cancel-in-progress: false

jobs:
  cross-sensor:
    name: Replay retained NISAR COGs and compare with Sentinel-2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the merged RiverShift implementation
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download retained per-product COG artifacts from the original run
        uses: actions/download-artifact@v4
        with:
          pattern: rivershift-product-b01-*
          path: source-products/
          run-id: "41642281327"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: false

      - name: Download the original prepared selection manifest
        uses: actions/download-artifact@v4
        with:
          pattern: rivershift-prepared-*
          path: prepared/
          run-id: "41642281327"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: false

      - name: Install the pinned RiverShift geospatial environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/river_shift/environment.yml
          cache-environment: true
          generate-run-shell: true

      - name: Rebuild the exact NISAR observed-date mask and compare with Sentinel-2
        shell: micromamba-shell {0}
        working-directory: tools/river_shift
        run: |
          set -euo pipefail
          echo "::group::Retained NISAR source verification"
          python --version
          gdalinfo --version
          python -c "import rasterio, numpy, scipy, shapely, pyproj, requests; print('RIVERSHIFT_CROSS_SENSOR_RUNTIME=PASS')"
          echo "::endgroup::"
          python -u replay_sentinel2_from_retained_run.py \
            --products-dir ../../source-products \
            --prepared-dir ../../prepared \
            --source-run-id "41642281327" \
            --observation-date "2026-07-12" \
            --output-dir ../../replay-output \
            --max-day-offset 3 \
            --max-cloud-cover 40 \
            --mndwi-threshold "0.0" \
            --minimum-common-support "0.80"

      - name: Publish a privacy-safe cross-sensor summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path("replay-output/sentinel2-cross-sensor/sentinel2_cross_sensor_agreement.json")
          manifest_path = Path("replay-output/cross_sensor_replay_manifest.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report_path.is_file() or not manifest_path.is_file():
              summary_path.write_text("## RiverShift Sentinel-2 replay\n\nNo report was produced. Review the preceding job logs.\n", encoding="utf-8")
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          observation = report.get("observation") or {}
          support = report.get("spatial_support") or {}
          metrics = report.get("metrics")
          lines = [
              "## RiverShift retained-run Sentinel-2 replay",
              "",
              f"- Status: **{report.get('status')}**",
              f"- Original NISAR run: `{manifest.get('source_workflow_run_id')}`",
              f"- NISAR observation: `{manifest.get('requested_observation_date')}`",
              f"- Actual NISAR dates: {', '.join(manifest.get('actual_nisar_observation_dates') or [])}",
              f"- Sentinel-2 STAC item: `{observation.get('sentinel2_item_id') or 'not found'}`",
              f"- Sentinel-2 date: `{observation.get('sentinel2_date') or 'not found'}`",
              f"- Scene cloud cover: {observation.get('cloud_cover_percent')}",
              f"- Date offset (days): {observation.get('absolute_date_offset_days')}",
              f"- Clear common-support fraction: {support.get('common_support_fraction')}",
              "",
          ]
          if isinstance(metrics, dict):
              lines.extend(["| Optical comparison | Precision | Recall | F1 | IoU |", "|---|---:|---:|---:|---:|"])
              for key, label in (("scl_water_class", "SCL water"), ("mndwi_water_class", "MNDWI water")):
                  values = metrics.get(key) or {}
                  def fmt(value):
                      return "n/a" if value is None else f"{float(value):.3f}"
                  lines.append(f"| {label} | {fmt(values.get('precision'))} | {fmt(values.get('recall'))} | {fmt(values.get('f1_score'))} | {fmt(values.get('intersection_over_union'))} |")
          else:
              lines.append("No agreement metrics were published because no eligible Sentinel-2 scene or sufficient clear common support was available.")
          lines.extend([
              "",
              "**Interpretation:** cross-sensor agreement screening only. Sentinel-2 SCL/MNDWI is not ground truth or field validation. The original NISAR run remains PROVISIONAL.",
              "",
              "Raw NISAR HDF5 was not downloaded again. No AOI coordinates, full report, water mask or signed asset URL was uploaded as a public artifact.",
          ])
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY